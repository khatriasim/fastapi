name: CI Pipeline

on:
  push:
    branches: [main]      # runs when you push to main
  pull_request:
    branches: [main]      # runs when you make a PR to main

jobs:
  test:
    runs-on: ubuntu-latest   # GitHub gives you a free Ubuntu server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fastapi_user
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: fastapi_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    steps:
      - name: Checkout code          # pull your code from github
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -v
        env:
          DATABASE_URL: postgresql://fastapi_user:password123@localhost:5433/fastapi_db
          REDIS_URL: redis://localhost:6380
          SECRET_KEY: testsecretkey
          ALGORITHM: HS256